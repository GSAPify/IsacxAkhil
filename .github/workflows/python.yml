name: Python

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/**", "configs/**", "pyproject.toml", ".github/workflows/python.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "scripts/**", "configs/**", "pyproject.toml", ".github/workflows/python.yml"]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Core package and dev tools only: no Isaac Sim, torch or Ultralytics.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pyright
      - run: pytest
