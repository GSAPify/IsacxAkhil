[package]
name = "vision-inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ONNX Runtime inference node for exported vision models"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vision-inference"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
